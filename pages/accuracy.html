<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Validation Pass</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #000000; /* Matte black */
    color: #FFFFFF; /* White text */
    padding: 32px;
  }

  .logo {
    font-size: 28px;
    font-weight: bold;
    color: #4CAF50; /* Bright green logo */
    margin-bottom: 16px;
    text-align: center;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #D4AF37; /* Metallic gold */
    text-align: center;
  }

  /* Instructions/info box */
  .info-box {
    background: #333333; /* Charcoal grey */
    border: 1px solid #D4AF37; /* Gold border */
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 14px;
  }

  /* Button styles */
  button {
    background-color: #4CAF50; /* Bright green */
    color: #FFFFFF;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover {
    background-color: #45a049;
  }

  /* Header style */
  .header {
    text-align: center;
    font-size: 22px;
    margin-bottom: 16px;
    color: #D4AF37; /* Gold */
  }

  /* Root container for output */
  #root {
    min-height: 200px;
  }

  /* Summary styles */
  .summary {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 15px;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }

  /* Mismatch table styles (unchanged) */
  table {
    border-collapse: collapse; font-size: 13px;
    font-family: "SF Mono", monospace; margin-bottom: 16px;
    width: 100%; table-layout: fixed;
  }
  col.num { width: 80px; }
  col.text { }
  th { text-align: left; padding: 4px 12px; color: #666; border-bottom: 1px solid #333; white-space: nowrap; }
  td { padding: 4px 12px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; }
  .over td { color: #ef9a9a; }
  .under td { color: #ffcc80; }
  .text { color: #888; white-space: normal; word-break: break-all; }
  .perfect { color: #81c784; font-size: 18px; margin-top: 24px; }

  /* Footer styling */
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

<div class="logo">🌟 Validation Pass</div>

<h1>Validation Pass</h1>

<div class="info-box">
  <h2>Instructions</h2>
  <p>This dashboard compares library height predictions against ground truth across fonts, sizes, and widths. Use the refresh button to rerun the sweep.</p>
</div>

<div style="text-align: center;">
  <button id="refreshBtn">Refresh Data</button>
</div>

<div id="root"><p>Loading...</p></div>

<!-- Your existing script -->
<script type="module" src="./accuracy.ts"></script>

<!-- Footer with date/credits -->
<footer>
  &copy; 2024 Your Name or Company. Last updated: <span id="date"></span>
</footer>

<script>
// Set current date in footer
document.getElementById('date').textContent = new Date().toLocaleDateString();

// Refresh button event
document.getElementById('refreshBtn').addEventListener('click', () => {
  // Reload the page to rerun the sweep
  location.reload();
});

// Optional: Initialize or run the sweep on page load (your script already handles this)
</script>

</body>
</html>
