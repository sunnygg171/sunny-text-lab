<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Validation Pass</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #000000; /* Matte black */
    color: #FFFFFF; /* White text */
    padding: 32px;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #D4AF37; /* Metallic gold */
    text-align: center;
  }

  /* Logo or project name */
  .logo {
    font-size: 28px;
    font-weight: bold;
    color: #4CAF50; /* Bright green for logo */
    margin-bottom: 16px;
    text-align: center;
  }

  /* Info box with instructions */
  .info-box {
    background: #333333; /* Charcoal grey */
    border: 1px solid #D4AF37; /* Gold border */
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 14px;
  }

  /* Button styles */
  button {
    background-color: #4CAF50; /* Bright green */
    color: #FFFFFF;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    margin: 10px 0;
  }
  button:hover {
    background-color: #45a049;
  }

  /* Header styles */
  .header {
    text-align: center;
    font-size: 22px;
    margin-bottom: 16px;
    color: #D4AF37; /* Gold */
  }

  /* Main content */
  #root {
    min-height: 200px;
  }

  /* Summary styles */
  .summary {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 15px;
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }

  /* Footer styles */
  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 12px;
    color: #888;
  }
</style>
</head>
<body>

<div class="logo">🌟 Validation Pass</div>

<h1>Validation Pass</h1>

<div class="info-box">
  <h2>Instructions</h2>
  <p>This dashboard compares library height predictions against ground truth across fonts, sizes, and widths. Use the refresh button to run a new sweep.</p>
</div>

<div style="text-align: center;">
  <button id="refreshBtn">Refresh Data</button>
</div>

<div id="root"><p>Loading...</p></div>

<!-- Your existing script -->
<script type="module" src="./accuracy.ts"></script>

<!-- Footer with date/credits -->
<footer>
  &copy; 2024 Your Name or Company. Last updated: <span id="date"></span>
</footer>

<script>
// Set current date in footer
document.getElementById('date').textContent = new Date().toLocaleDateString();

// Refresh button action
document.getElementById('refreshBtn').addEventListener('click', () => {
  // You can add refresh logic here if needed
  location.reload();
});
</script>

</body>
</html>
